# Release/document allowlist. This is the single source of truth for what the
# downloader and ingestion pipeline may process. Each release is independently
# allowlisted so that more than one 3GPP release can be indexed at once (the
# retrieval layer filters by `release` at query time; see app/api/schemas.py
# and app/retrieval/hybrid.py). A spec NOT listed here is never fetched, never
# indexed, never returned — the allowlist is the choke point.
#
# Release-isolation guarantee is still enforced: an archive's filename letter
# code must match the release being indexed (RELEASE_LETTERS in
# ingestion/downloader.py), so Rel-17 archives ('h') and Rel-18 archives ('i')
# never mix within a single release's pipeline.
#
# To enable an additional release: set `enabled: true` for it and populate its
# `documents` allowlist (add specs via `scripts/discover_corpus.py --add`).

default_release: Rel-18

releases:
  Rel-17:
    release_number: 17
    enabled: true
    sources:
      portal: "https://portal.3gpp.org/"
      repository_root: "https://www.3gpp.org/ftp/specs/latest/Rel-17/"
      forge: "https://forge.3gpp.org/swagger/tools/parser.html"
    documents:
      core: []
      extended: []

  Rel-18:
    release_number: 18
    enabled: true
    sources:
      portal: "https://portal.3gpp.org/"
      repository_root: "https://www.3gpp.org/ftp/specs/latest/Rel-18/"
      forge: "https://forge.3gpp.org/swagger/tools/parser.html"
    documents:
      core:
        - spec_number: "23.501"
          title: "System architecture for the 5G System (5GS)"
          series: "23"
        - spec_number: "23.502"
          title: "Procedures for the 5G System (5GS)"
          series: "23"
        - spec_number: "24.501"
          title: "Non-Access-Stratum (NAS) protocol for 5G System (5GS)"
          series: "24"
      extended:
        - spec_number: "38.300"
          title: "NR and NG-RAN Overall Description"
          series: "38"
        - spec_number: "38.331"
          title: "NR Radio Resource Control (RRC) protocol specification"
          series: "38"
        - spec_number: "33.501"
          title: "Security architecture and procedures for 5G System"
          series: "33"
        - spec_number: "29.244"
          title: "Interface between the Control Plane and the User Plane nodes"
          series: "29"
        - spec_number: "29.500"
          title: "5G System; Technical Realization of Service Based Architecture"
          series: "29"

  # Known-but-disabled releases. Set `enabled: true` (and populate `documents`)
  # to index them. The filename letter code for each release is fixed in
  # ingestion/downloader.py: 15=f, 16=g, 17=h, 18=i, 19=j, 20=k.
  Rel-16:
    release_number: 16
    enabled: false
    sources:
      portal: "https://portal.3gpp.org/"
      repository_root: "https://www.3gpp.org/ftp/specs/latest/Rel-16/"
      forge: "https://forge.3gpp.org/swagger/tools/parser.html"
    documents:
      core: []
      extended: []

  Rel-19:
    release_number: 19
    enabled: false
    sources:
      portal: "https://portal.3gpp.org/"
      repository_root: "https://www.3gpp.org/ftp/specs/latest/Rel-19/"
      forge: "https://forge.3gpp.org/swagger/tools/parser.html"
    documents:
      core: []
      extended: []

  Rel-20:
    release_number: 20
    enabled: false
    sources:
      portal: "https://portal.3gpp.org/"
      repository_root: "https://www.3gpp.org/ftp/specs/latest/Rel-20/"
      forge: "https://forge.3gpp.org/swagger/tools/parser.html"
    documents:
      core: []
      extended: []
